<script>
document.addEventListener("DOMContentLoaded", () => {
  const root = document.documentElement;
  const apply = (m) => {
    root.classList.toggle("light", m === "light");
    try { localStorage.setItem("slides-mode", m); } catch (e) {}
  };
  let saved = "dark";
  try { saved = localStorage.getItem("slides-mode") || "dark"; } catch (e) {}
  apply(saved);

  const btn = document.createElement("button");
  btn.id = "mode-toggle";
  btn.textContent = "◐";
  btn.title = "Toggle light/dark (T)";
  btn.onclick = () => apply(root.classList.contains("light") ? "dark" : "light");
  document.body.appendChild(btn);

  document.addEventListener("keydown", (e) => {
    if (e.key === "t" || e.key === "T") btn.click();
  });
});
</script>
