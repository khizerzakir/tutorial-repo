name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:        # adds a manual "Run workflow" button

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release  # better: pin your local version, e.g. 1.6.42

      # Only needed once you add executable {python} cells
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - run: pip install -r code/requirements.txt jupyter

      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}